<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>éxpert — Medical Aesthetics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Manrope:wght@400;500&family=Oswald:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E2D6C9; --bg2:#F6F2ED; --ink:#171513; --muted:#B9A899; --white:#fff;
  --ease:cubic-bezier(.22,1,.36,1);
  --f-head:'Oswald','Arial Narrow',Impact,sans-serif;
  --f-body:'Manrope','Helvetica Neue',Arial,sans-serif;
  --f-logo:'Cormorant Garamond','Times New Roman',serif;
  --pad:clamp(20px,4vw,56px);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}

/* Header */
.header{position:absolute;top:env(safe-area-inset-top,0px);left:0;right:0;z-index:20;height:92px;padding:0 var(--pad);display:flex;align-items:center;justify-content:space-between;gap:24px}
.logo{display:flex;flex-direction:column;align-items:center;line-height:1}
.logo b{display:block;font-family:var(--f-logo);font-weight:400;font-size:40px;line-height:1;letter-spacing:-.005em;text-align:center}
.logo small{display:block;font-size:8.5px;line-height:1;letter-spacing:.1em;font-weight:400;margin-top:7px;text-align:center;white-space:nowrap}
.nav ul{display:flex;gap:clamp(20px,2.6vw,40px);list-style:none;margin:0;padding:0}
.nav a{font-size:14px;font-weight:500;position:relative;padding:6px 0}
.nav a::after{content:"";position:absolute;left:0;bottom:0;height:1px;width:100%;background:currentColor;transform:scaleX(0);transform-origin:left;transition:transform .4s var(--ease)}
.nav a:hover::after{transform:scaleX(1)}
.menu-btn{display:none;background:none;border:0;width:44px;height:44px;cursor:pointer;color:var(--ink)}
.menu-btn span{display:block;width:24px;height:1.5px;background:currentColor;margin:6px auto;transition:transform .3s var(--ease),opacity .3s}
.menu-btn[aria-expanded=true] span:first-child{transform:translateY(3.7px) rotate(45deg)}
.menu-btn[aria-expanded=true] span:last-child{transform:translateY(-3.7px) rotate(-45deg)}

/* Button */
.btn{display:inline-flex;align-items:center;gap:14px;background:var(--ink);color:var(--white);border:0;font:500 14px/1 var(--f-body);padding:16px 24px;border-radius:30px;cursor:pointer;transition:background .35s var(--ease)}
.btn svg{transition:transform .35s var(--ease)}
.btn:hover{background:#3a352f}
.btn:hover svg{transform:translateX(5px)}
.btn:focus-visible{outline-color:var(--ink);outline-offset:4px}
.btn.sm{padding:12px 18px;font-size:13px}

/* Hero */
.hero{position:relative;overflow:hidden;min-height:100vh;min-height:100svh;display:grid;grid-template-columns:repeat(12,1fr);column-gap:24px;padding:0 var(--pad)}
.copy{grid-column:1 / span 7;align-self:center;padding:132px 0 96px;position:relative;z-index:5;max-width:860px}
.eyebrow{display:flex;align-items:center;gap:14px;font-size:12px;letter-spacing:.18em;font-weight:500;margin:0 0 32px}
.eyebrow::before{content:"";width:40px;height:1px;background:var(--ink)}
h1{font-family:var(--f-head);font-weight:500;text-transform:uppercase;font-size:clamp(48px,4.4vw,68px);line-height:1.04;letter-spacing:-.015em;margin:0 0 36px}
h1 .ln{display:block;overflow:hidden;padding-bottom:.04em}
h1 .ln>span{display:block}
.w{display:inline}
@media (min-width:1200px){.copy .sub{max-width:none}.sl{display:block;white-space:nowrap}}
@media (max-width:560px){.w{display:block}}
.sub{font-size:clamp(15px,1.15vw,17px);line-height:1.6;max-width:min(520px,calc(48vw - var(--pad) - 32px));margin:0 0 44px}
.portrait{position:absolute;top:92px;right:0;bottom:0;width:46vw;width:clamp(46vw,80svh,52vw);margin:0;z-index:1}
.portrait img{position:absolute;left:0;top:0;width:calc(100% - 40px);height:112%;object-fit:contain;object-position:right top;display:block}
.meta{position:absolute;left:var(--pad);bottom:32px;z-index:6;display:flex;align-items:center;gap:18px;font-size:12px;letter-spacing:.14em;font-weight:500}
.meta a{display:inline-flex;width:40px;height:40px;border:1px solid var(--ink);border-radius:50%;align-items:center;justify-content:center;transition:background .3s,color .3s}
.meta a:hover{background:var(--ink);color:var(--white)}

/* Toast */
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);background:var(--bg2);color:var(--ink);border:1px solid var(--ink);padding:14px 20px;font-size:14px;max-width:calc(100% - 40px);opacity:0;pointer-events:none;transition:.5s var(--ease);z-index:50}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* Motion */
@keyframes up{from{transform:translateY(105%)}to{transform:none}}
@keyframes fade{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes img{from{opacity:0;transform:scale(1.06)}to{opacity:1;transform:none}}
.a-fade{animation:fade .9s var(--ease) both}
h1 .ln>span{animation:up .95s var(--ease) both}
.portrait>*{animation:img 1.3s var(--ease) .25s both;transform-origin:100% 100%}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* Tablet / mobile */
@media (max-width:980px){
  .nav{position:fixed;inset:0;background:var(--bg2);z-index:15;display:flex;align-items:center;padding:0 var(--pad);visibility:hidden;opacity:0;transition:opacity .4s var(--ease),visibility .4s}
  .nav.open{visibility:visible;opacity:1}
  .nav ul{flex-direction:column;gap:18px}
  .nav a{font:500 clamp(36px,10vw,56px)/1.05 var(--f-head);text-transform:uppercase}
  .menu-btn{display:block;position:relative;z-index:30}
  .header .btn{display:none}
  .header{height:76px}
  .logo b{font-size:34px}
  .hero{display:flex;flex-direction:column;padding:0}
  .copy{padding:108px var(--pad) 32px;max-width:none}
  .eyebrow{margin-bottom:22px}
  h1{font-size:clamp(38px,9vw,58px);margin-bottom:22px}
  .sub{margin-bottom:28px;font-size:16px;max-width:520px}
  .portrait{position:relative;top:0;width:100%;height:auto;aspect-ratio:4/5;max-height:72svh;margin-top:12px}
  .portrait img{width:100%;height:100%;object-position:center bottom}
  .meta{position:static;padding:20px var(--pad) 28px;justify-content:space-between}
}
@media (min-width:981px) and (max-height:700px){
  .copy{padding-top:112px;padding-bottom:80px}
  h1{margin-bottom:24px}.sub{margin-bottom:28px}
}
/* Leaf-shadow layer behind the portrait */
.leaves{position:absolute;left:-26%;top:-16%;width:126%;height:116%;overflow:visible;filter:blur(6px);pointer-events:none}

/* Large screens */
@media (min-width:1800px){
  .logo b{font-size:46px}.nav a{font-size:15px}
  h1{font-size:clamp(68px,3.7vw,92px)}
  .sub{font-size:clamp(17px,.95vw,21px)}
  .btn{font-size:15px;padding:18px 28px}
}
/* Small desktop */
@media (min-width:981px) and (max-width:1199px){
  .nav a{font-size:13px}.nav ul{gap:clamp(16px,2vw,28px)}
  .header .btn{padding:11px 16px}
}
/* Tablet and phone */
@media (max-width:980px){
  .logo{position:relative;z-index:16}
  .leaves{left:-10%;top:-6%;width:114%;height:106%}
}
@media (min-width:561px) and (max-width:980px){
  .copy{padding-top:124px;max-width:680px}
  h1{font-size:clamp(48px,7.2vw,64px)}
  .sub{font-size:17px}
  .portrait img{width:calc(100% - var(--pad));object-position:right bottom}
}
@media (max-width:560px){
  .copy .btn{width:100%;justify-content:space-between}
}
@media (max-width:360px){
  .btn{padding:15px 16px;font-size:13px}
  .copy{padding-top:96px}
}
/* Sections 02-03 */
:root{--line:rgba(23,21,19,.22)}
.sec{padding:clamp(72px,9vw,140px) var(--pad)}.sec.alt{background:var(--bg2)}
.sec h2{font:500 clamp(32px,4vw,60px)/1.04 var(--f-head);text-transform:uppercase;letter-spacing:-.015em;margin:0 0 clamp(40px,5vw,72px);max-width:14em;text-wrap:balance}
.sec.why h2{font-size:clamp(30px,5vw,76px);max-width:none;margin-bottom:28px}.why .l{display:block}
.rows{border-bottom:1px solid var(--line)}
.row{display:grid;grid-template-columns:minmax(0,1.8fr) minmax(0,6.3fr) minmax(0,4.5fr);grid-template-areas:'t i d';column-gap:32px;row-gap:28px;padding:28px 0 48px;border-top:1px solid var(--line)}.row .shot{aspect-ratio:19/10}
.row .t{grid-area:t}.row .i{grid-area:i}.row .d{grid-area:d;display:flex;flex-direction:column;justify-content:space-between;gap:28px}
.t .n,.panel .n{display:block;font-size:12px;letter-spacing:.18em;font-weight:500}.t .n{margin-bottom:14px}
.t h3{font:500 clamp(20px,1.7vw,26px)/1.1 var(--f-head);text-transform:uppercase;letter-spacing:-.01em;margin:0;overflow-wrap:break-word}
.d p{margin:0;font-size:14px;line-height:1.6}.d .btn{align-self:flex-end}
.shot{position:relative;aspect-ratio:16/10;background:var(--muted);overflow:hidden;margin:0}
.shot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ph2{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;padding:32px;font-size:11px;letter-spacing:.16em;font-weight:500}
.ph2::before{content:'';position:absolute;inset:20px;border:1px solid rgba(23,21,19,.3)}
.ph2>*{position:relative}.ph2 b{font:500 22px var(--f-head);letter-spacing:.04em}.ph2 span{max-width:34ch;font-size:13px;line-height:1.4;letter-spacing:.02em}.ph2 i{font-style:normal;opacity:.7}
.lead{font-size:clamp(16px,1.2vw,18px);line-height:1.65;max-width:560px;margin:0}
.vis{margin:clamp(40px,5vw,72px) 0 0}.vis .shot{aspect-ratio:21/9}
.adv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));margin-top:-40px;position:relative;z-index:2}
.panel{background:var(--bg);padding:36px 36px 40px;border-left:1px solid var(--line)}.panel:nth-child(odd){border-left:0}.panel:nth-child(n+3){border-top:1px solid var(--line)}
.panel .n{margin-bottom:28px}.panel h3{font:500 clamp(22px,2vw,30px)/1.12 var(--f-head);text-transform:uppercase;margin:0 0 18px}.panel p{margin:0;font-size:15px;line-height:1.6;max-width:62ch}
.docrow{display:flex;justify-content:flex-end;align-items:center;gap:20px;margin-top:40px;padding-top:28px;border-top:1px solid var(--line)}
.doc{display:inline-flex;align-items:center;gap:12px;background:none;color:var(--ink);border:1px solid var(--ink);border-radius:30px;padding:14px 22px;font:500 14px/1 var(--f-body);transition:background .35s var(--ease),color .35s}
a.doc:hover{background:var(--ink);color:var(--white)}.doc.off{border-style:dashed;opacity:.55;cursor:not-allowed}.note{font-size:13px}
.rv{opacity:0;transform:translateY(26px);transition:opacity .9s var(--ease),transform .9s var(--ease);transition-delay:var(--d,0s)}.rv.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){.rv{opacity:1;transform:none}}
@media (max-width:1099px){
  
  .adv{grid-template-columns:repeat(2,minmax(0,1fr))}.panel:nth-child(odd){border-left:0}.panel:nth-child(n+3){border-top:1px solid var(--line)}
  .lead{margin-left:0}.vis .shot{aspect-ratio:16/9}.panel{padding:28px 24px 32px}
}
@media (max-width:760px){
  .row{grid-template-columns:1fr;grid-template-areas:'t' 'i' 'd';row-gap:20px;padding:24px 0 36px}.row .d{gap:20px}.row .d .btn{align-self:stretch;justify-content:space-between}.row .shot{aspect-ratio:16/10}
  .adv{grid-template-columns:1fr;margin-top:0}.panel{border-left:0;border-top:1px solid var(--line)}.panel:first-child{border-top:0}
  .vis .shot{aspect-ratio:4/3}
  .docrow{flex-direction:column;align-items:flex-start;justify-content:flex-start}.doc{width:100%;justify-content:space-between}
}
@media (min-width:761px) and (max-width:1199px){.row{grid-template-columns:minmax(0,.8fr) minmax(0,2fr);grid-template-areas:'t i' '. d'}.row .d{gap:20px}.row .d .btn{align-self:flex-start}}
/* Sections 04-08 */
.sec.n h2{margin-bottom:28px}
.sec.dark{background:var(--ink);color:var(--bg2)}.dark .eyebrow::before{background:var(--bg2)}.dark :focus-visible{outline-color:var(--bg2)}
.dark .btn{background:var(--bg2);color:var(--ink)}.dark .btn:hover{background:#fff}
.ba{position:relative;width:88%;margin:clamp(40px,5vw,64px) 0 0 auto;aspect-ratio:16/9;overflow:hidden;touch-action:pan-y;cursor:ew-resize;user-select:none;background:var(--muted);--p:50%}
.lay{position:absolute;inset:0}.lay img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}
.lay.a{background:#CDBFB0}.lay.b{background:var(--muted);clip-path:inset(0 calc(100% - var(--p)) 0 0)}
.tag{position:absolute;top:16px;font-size:11px;letter-spacing:.18em;font-weight:500;background:var(--bg2);padding:7px 10px;z-index:2}.tag.l{left:16px}.tag.r{right:16px}
.hd{position:absolute;top:0;bottom:0;left:var(--p);width:44px;margin-left:-22px;z-index:3;display:flex;justify-content:center;cursor:ew-resize}.hd::before{content:'';width:1px;background:var(--bg2)}
.hd i{position:absolute;top:50%;margin-top:-22px;width:44px;height:44px;border-radius:50%;background:var(--bg2);display:flex;align-items:center;justify-content:center;font-style:normal;font-size:14px}
.cap{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 32px;width:88%;margin:24px 0 0 auto;padding-top:20px;border-top:1px solid var(--line)}.cap b{font:500 clamp(24px,2.4vw,34px)/1 var(--f-head);letter-spacing:.02em}.cap p{margin:0 0 0 auto;font-size:13px;max-width:44ch}
.cases{display:flex;overflow-x:auto;width:88%;margin:24px 0 0 auto;border-top:1px solid var(--line)}.cases:empty{display:none}.case{flex:none;background:none;border:0;border-right:1px solid var(--line);padding:18px 28px;font:500 14px var(--f-body);color:inherit;cursor:pointer}.case[aria-current=true]{background:var(--bg2)}
.sp{display:grid;grid-template-columns:minmax(0,4.4fr) minmax(0,7.6fr);grid-template-areas:'h p' 'n p';grid-template-rows:auto 1fr;column-gap:clamp(32px,5vw,80px)}
.sph{grid-area:h}.spp{grid-area:p}.spn{grid-area:n;align-self:end}
.pt{position:relative;aspect-ratio:5/6;max-height:90svh;width:100%;background:var(--muted);overflow:hidden;touch-action:pan-y}.pt .lay{opacity:0;transition:opacity .45s var(--ease)}.pt .lay.on{opacity:1}
.inf{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px 24px;padding-top:20px;margin-top:20px;border-top:1px solid var(--line);transition:opacity .35s var(--ease)}.inf h3{font:500 clamp(26px,2.6vw,38px)/1.05 var(--f-head);text-transform:uppercase;margin:0}.inf p{margin:0;font-size:15px}
.spl{list-style:none;margin:0 0 28px;padding:0;border-top:1px solid var(--line)}.spl button{display:flex;gap:16px;width:100%;background:none;border:0;border-bottom:1px solid var(--line);padding:16px 0;font:500 15px var(--f-body);color:inherit;cursor:pointer;text-align:left;opacity:.5;transition:opacity .3s}.spl button[aria-current=true],.spl button:hover{opacity:1}
.ctl{display:flex;align-items:center;gap:12px}.ctl span{margin-left:auto;font-size:12px;letter-spacing:.18em;font-weight:500}
.arr{width:48px;height:48px;border:1px solid var(--ink);border-radius:50%;background:none;color:inherit;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:background .3s,color .3s}.arr:hover{background:var(--ink);color:var(--white)}
.tc{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line);margin-top:clamp(32px,4vw,56px)}
.tech{padding:40px clamp(20px,3vw,48px) 48px 0}.tech+.tech{padding-left:clamp(20px,3vw,48px);padding-right:0;border-left:1px solid var(--line)}.tech .shot{aspect-ratio:4/3}
.tl8{display:flex;justify-content:space-between;align-items:baseline;margin:28px 0 12px;font-size:12px;letter-spacing:.18em;font-weight:500}.tl8 em{font:500 clamp(28px,3vw,44px)/1 var(--f-head);font-style:normal;color:var(--muted)}
.tech h3{font:500 clamp(34px,4vw,60px)/1 var(--f-head);text-transform:uppercase;letter-spacing:-.01em;margin:0 0 10px}.tech h4{font:500 16px var(--f-body);margin:0 0 16px}.tech p{margin:0 0 24px;font-size:15px;line-height:1.65;max-width:52ch}
.lnk{background:none;border:0;border-bottom:1px solid currentColor;padding:0 0 4px;font:500 14px var(--f-body);color:inherit;cursor:pointer}.tech p.more{margin:20px 0 0;font-size:14px}
.docs{display:flex;flex-wrap:wrap;align-items:center;gap:16px 24px;margin-top:24px;padding-top:28px;border-top:1px solid var(--line)}.docs .note:first-child{margin-right:auto}
.tl{position:relative;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:32px;padding-top:72px;margin-top:clamp(32px,4vw,56px);--f:0%}
.tl::before,.tl .fill{content:'';position:absolute;top:8px;left:0;height:1px;background:var(--line)}.tl::before{right:0}.tl .fill{width:var(--f);background:var(--ink);transition:width .3s linear}
.stp{position:relative;opacity:.35;transition:opacity .6s var(--ease)}.stp.on{opacity:1}
.dot{position:absolute;top:-72px;left:0;width:17px;height:17px;border-radius:50%;border:1px solid var(--ink);background:var(--bg2);transition:background .6s}.stp.on .dot{background:var(--ink)}
.stp .n{display:block;font-size:12px;letter-spacing:.18em;font-weight:500;margin-bottom:16px}.stp h3{font:500 clamp(24px,2.4vw,34px)/1.05 var(--f-head);text-transform:uppercase;margin:0 0 14px}.stp p{margin:0;font-size:15px;line-height:1.6;max-width:30ch}
.c8{display:grid;grid-template-columns:minmax(0,11fr) minmax(0,9fr);align-items:start;gap:clamp(32px,5vw,80px);margin-top:clamp(32px,4vw,56px)}
.fm .f{margin-bottom:8px}.fm label{display:block;font-size:12px;letter-spacing:.14em;text-transform:uppercase;margin:0 0 6px}
.fm input,.fm select{width:100%;background:none;border:0;border-bottom:1px solid rgba(246,242,237,.45);border-radius:0;color:var(--bg2);font:400 16px var(--f-body);padding:10px 0 12px;appearance:none}.fm select option{color:#171513}
.fm input::placeholder{color:rgba(246,242,237,.5)}.fm [aria-invalid=true]{border-bottom-color:#E8C3B3}.fm input:focus-visible,.fm select:focus-visible{outline:2px solid var(--bg2);outline-offset:4px}
.sel{position:relative}.sel::after{content:'↓';position:absolute;right:2px;bottom:12px;pointer-events:none}
.er{display:block;min-height:20px;font-size:13px;margin-top:6px;color:#E8C3B3}.st{margin:16px 0 0;font-size:14px;min-height:20px}
.ct{display:grid;grid-template-columns:1fr;gap:28px;margin:0;padding:6px 0 0 clamp(24px,4vw,64px);border-left:1px solid rgba(246,242,237,.22)}.ct dt{font-size:11px;letter-spacing:.16em;opacity:.65;margin-bottom:6px}.ct dd{margin:0;font-size:clamp(16px,1.6vw,20px)}.ct .pl{opacity:.55}
.foot{margin-top:clamp(64px,8vw,120px);padding-top:40px;border-top:1px solid rgba(246,242,237,.22);display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:32px}
.wm{display:flex;flex-direction:column;align-items:center;width:max-content;max-width:100%;font-size:clamp(44px,5.2vw,76px)}.wm b{display:block;font:400 1em/1 var(--f-logo);letter-spacing:-.005em;text-align:center}.wm small{display:block;margin-top:.32em;font-size:.17em;line-height:1;letter-spacing:.1em;font-weight:400;text-align:center;white-space:nowrap}
.fl{display:flex;flex-wrap:wrap;gap:12px 28px;font-size:13px}.fl a:hover,.fine a:hover{text-decoration:underline}
.fine{width:100%;display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px 28px;font-size:12px;opacity:.65;border-top:1px solid rgba(246,242,237,.22);padding-top:20px}
@media (max-width:860px){
  .ba,.cap,.cases{width:100%}.ba{aspect-ratio:4/3}.cap p{margin-left:0}

<script>
const CONSULT_TARGET = "https://wa.me/77770543449";   // e.g. "#consultation" or a contact URL

/* logo lockup: caption width = wordmark width */
const fitLogo=()=>document.querySelectorAll('.logo,.wm').forEach(l=>{const b=l.querySelector('b'),m=l.querySelector('small');if(!b||!m)return;m.style.fontSize='10px';m.style.marginRight='0';const W=b.getBoundingClientRect().width,w=m.getBoundingClientRect().width;if(!W||!w)return;const ls=parseFloat(getComputedStyle(m).letterSpacing)||0;m.style.fontSize=(10*W/(w-ls))+'px'});
fitLogo();addEventListener('resize',fitLogo);if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fitLogo);
const nav=document.getElementById('nav'),btn=document.getElementById('menu');
const setMenu=o=>{nav.classList.toggle('open',o);btn.setAttribute('aria-expanded',o);btn.setAttribute('aria-label',o?'Закрыть меню':'Открыть меню');document.body.style.overflow=o?'hidden':''};
btn.onclick=()=>setMenu(!nav.classList.contains('open'));
nav.querySelectorAll('a').forEach(a=>a.addEventListener('click',()=>setMenu(false)));
document.addEventListener('keydown',e=>{if(e.key==='Escape')setMenu(false)});

const toast=document.getElementById('toast');let t;
document.querySelectorAll('[data-consult]').forEach(b=>b.addEventListener('click',()=>{
  if(CONSULT_TARGET){const el=CONSULT_TARGET.startsWith('#')&&document.querySelector(CONSULT_TARGET);el?el.scrollIntoView({behavior:'smooth'}):window.open(CONSULT_TARGET,'_blank','noopener');return}
  toast.classList.add('on');clearTimeout(t);t=setTimeout(()=>toast.classList.remove('on'),3500);
}));

/* Leaf shadows: soft olive-branch silhouettes drawn as SVG */
(function(){const g=document.getElementById('lv');if(!g)return;const ns='http://www.w3.org/2000/svg';
const rnd=i=>{const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x)};
function el(n,a){const e=document.createElementNS(ns,n);for(const k in a)e.setAttribute(k,a[k]);g.appendChild(e)}
function leaf(x,y,a,L,w){el('path',{d:'M0 0C'+L*.25+' '+-w+' '+L*.7+' '+-w*.9+' '+L+' 0C'+L*.7+' '+w*.9+' '+L*.25+' '+w+' 0 0Z',transform:'translate('+x.toFixed(1)+' '+y.toFixed(1)+') rotate('+a.toFixed(1)+')'})}
function branch(p,q,r,n,len,w,s){
 const at=t=>{const u=1-t;return[u*u*p[0]+2*u*t*q[0]+t*t*r[0],u*u*p[1]+2*u*t*q[1]+t*t*r[1],Math.atan2(2*u*(q[1]-p[1])+2*t*(r[1]-q[1]),2*u*(q[0]-p[0])+2*t*(r[0]-q[0]))*180/Math.PI]};
 let d='';for(let i=0;i<=40;i++){const c=at(i/40);d+=(i?'L':'M')+c[0].toFixed(1)+' '+c[1].toFixed(1)}
 el('path',{d:d,fill:'none',stroke:'#7a6451','stroke-width':3.5});
 for(let i=1;i<=n;i++){const t=.1+.9*i/n,c=at(t),k=1-.55*t,L=len*k*(.88+.24*rnd(i+s)),w2=w*k;
  leaf(c[0],c[1],c[2]-(38+10*rnd(i+s+9)),L,w2);
  const c2=at(Math.min(1,t+.03));leaf(c2[0],c2[1],c2[2]+(38+10*rnd(i+s+19)),L*(.9+.2*rnd(i+s+5)),w2)}
 const e=at(1);leaf(e[0],e[1],e[2],len*.4,w*.5)}
branch([112,940],[165,580],[377,172],11,125,13,1);
branch([782,894],[700,740],[590,520],7,95,10,40);
})();
